<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">Oreada | Shoqatë Ambjentaliste</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              brand: {
                light: '#a7f3d0',
                DEFAULT: '#10b981',
                dark: '#047857',
              }
            }
          }
        }
      }
    </script>
</head>
<body>

    <div id="navbar-placeholder"></div>

    
    
    
    
    <section class="py-32 bg-gradient-to-br from-green-50 to-emerald-100 relative min-h-screen flex items-center overflow-hidden">
        <!-- Decorative blobs -->
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-green-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
        <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-emerald-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full">
            <div class="bg-white/70 backdrop-blur-xl rounded-[3rem] shadow-2xl p-8 md:p-16 border border-white/50 fade-in-up">
                <div class="grid lg:grid-cols-2 gap-12 lg:gap-20 items-center">
                    <div>
                        <span class="inline-block py-1 px-3 rounded-full bg-green-100 text-green-700 text-sm font-bold tracking-widest uppercase mb-6" data-i18n="about_badge_title">Komuniteti</span>
                        <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-gray-900 mb-8" data-i18n="about_title">Rreth Nesh</h1>
                        <div class="w-20 h-1.5 bg-green-500 rounded-full mb-8"></div>
                        <p class="text-xl text-gray-700 leading-relaxed font-medium" data-i18n="about_desc">Qëllimi kryesor i Shoqatës është mbrojtja, ruajtja, rikuperimi dhe përmirësimi i mjedisit, biodiversitetit, ekosistemeve dhe burimeve natyrore në të gjitha dimensionet e tyre, duke promovuar qëndrueshmërinë ekologjike dhe ndërgjegjësimin publik.</p>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-0 bg-gradient-to-tr from-green-300 to-emerald-400 rounded-[2.5rem] transform rotate-6 scale-105 opacity-20"></div>
                        <img data-content-src="about_image" src="img/6.webp" alt="Rreth Nesh" data-i18n-alt="about_title" class="relative z-10 rounded-[2.5rem] shadow-xl w-full object-cover aspect-square md:aspect-auto md:h-[500px]">
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    
    
    

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="site-content.js"></script>
    <script src="script.js"></script>
</body>
</html>
